[package]
name = "leanbun-macos-acl-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.leanbun]
lifecycle = "retained-historical-platform-support"
default-member = false
replacement-boundary = "none-mainline-does-not-require-privileged-acl"

[lib]
path = "src/lib.rs"

[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
