[package]
name = "leanbun-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobins = false

[dependencies]
leanbun-core = { path = "../leanbun-core" }
leanbun-generation = { path = "../leanbun-generation" }
leanbun-lake-bridge = { path = "../leanbun-lake-bridge" }
leanbun-lock = { path = "../leanbun-lock" }
