[workspace]
resolver = "3"
members = [
  "crates/leanbun-core",
  "crates/leanbun-evidence",
  "crates/leanbun-package",
  "crates/leanbun-lake-bridge",
  "crates/leanbun-resolver",
  "crates/leanbun-store",
  "crates/leanbun-generation",
  "crates/leanbun-build",
  "crates/leanbun-managed",
  "crates/leanbun-cli",
]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
